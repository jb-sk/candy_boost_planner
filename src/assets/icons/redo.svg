<!-- redo icon (dreamy-lab) -->
<!-- 中心 (11, 12)・半径 7 の円弧。開きは右上 -30° から右下 72° まで。
     矢じりは小さくても向きが分かるよう塗りの三角形にし、弧の向き（接線）に合わせる。
     矢じりのぶん右へ寄らないよう、円の中心を左右の中央から 1 ずらす -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Redo">
  <path
    d="M13.6 10.5L19.16 12.14L20.53 6.5Z"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <path
    d="M17.06 8.5A7 7 0 1 0 13.16 18.66"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
