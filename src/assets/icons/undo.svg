<!-- undo icon (dreamy-lab) -->
<!-- redo.svg を左右反転した形。中心 (13, 12)・半径 7 の円弧。開きは左上から左下まで。
     矢じりは小さくても向きが分かるよう塗りの三角形にし、弧の向き（接線）に合わせる。
     矢じりのぶん右へ寄らないよう、円の中心を左右の中央から 1 ずらす -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Undo">
  <path
    d="M10.4 10.5L4.84 12.14L3.47 6.5Z"
    fill="currentColor"
    stroke="currentColor"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  <path
    d="M6.94 8.5A7 7 0 1 1 10.84 18.66"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
