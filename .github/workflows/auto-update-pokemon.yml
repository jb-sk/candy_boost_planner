# ポケモンマスターデータ自動更新ワークフロー
# Wikiをチェックして新規ポケモン・既存差分・フォーム更新があればPRを自動作成
name: Auto Update Pokemon Data

on:
  schedule:
    # 毎日 UTC 00:23 (JST 09:23) に実行（毎月1日はコード内分岐で全件チェック）
    # 毎時0分は GitHub の定期実行が混んで遅れやすいので、半端な分にずらす
    - cron: '23 0 * * *'
  workflow_dispatch:
    inputs:
      refresh_en_names:
        description: 'Re-fetch all English names from PokeAPI'
        type: boolean
        default: false
      refresh_candy_families:
        description: 'Re-validate all candy families from Wiki'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  update-pokemon-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '>=24.22.1 <25.0.0'

      - name: Enable pnpm
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch Wiki snapshot
        id: wiki_fetch
        run: |
          echo "=== Wiki スナップショット取得 ==="
          EXIT_CODE=0
          node scripts/generate-pokemon-db.mjs \
            --out-file /tmp/pokemon-db.ts \
            --out-json /tmp/pokemon-db.json || EXIT_CODE=$?

          # exit 79 = fetch一時障害（503等）→ スキップ
          if [ "$EXIT_CODE" -eq 79 ]; then
            echo "⚠️ fetch一時障害のため Wiki 更新チェックをスキップします。"
            echo "fetched=false" >> "$GITHUB_OUTPUT"
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ Wiki 取得に失敗しました（exit=$EXIT_CODE）"
            exit 1
          else
            echo "fetched=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone pokesleep-tool for form verification
        if: steps.wiki_fetch.outputs.fetched == 'true' || github.event.inputs.refresh_candy_families == 'true'
        run: |
          git clone --depth 1 https://github.com/nitoyon/pokesleep-tool.git /tmp/pokesleep-tool
          echo "pokesleep-tool cloned to /tmp/pokesleep-tool"

      - name: Verify and auto-fix form mapping
        if: steps.wiki_fetch.outputs.fetched == 'true'
        id: form_verify
        run: |
          echo "=== フォーム番号突合 & 自動修正（最新Wikiスナップショット使用）==="
          VERIFY_EXIT=0
          VERIFY_OUTPUT=$(node scripts/verify-form-mapping.mjs \
            --pokesleep-tool /tmp/pokesleep-tool \
            --db /tmp/pokemon-db.json 2>&1) || VERIFY_EXIT=$?
          echo "$VERIFY_OUTPUT"

          # [SUMMARY] 1行に限定して各件数を抽出（ログ内の別行による誤マッチを防ぐ）
          SUMMARY_LINE=$(printf '%s\n' "$VERIFY_OUTPUT" | grep '^\[SUMMARY\]' | tail -n 1 || true)
          FIXES=$(printf '%s\n' "$SUMMARY_LINE" | grep -oP '(?<=fixes=)\d+' || echo "0")
          UNFIXABLE=$(printf '%s\n' "$SUMMARY_LINE" | grep -oP '(?<=unfixable=)\d+' || echo "0")
          ERRORS=$(printf '%s\n' "$SUMMARY_LINE" | grep -oP '(?<=errors=)\d+' || echo "0")
          NEEDS_REGENERATE=$(printf '%s\n' "$SUMMARY_LINE" | grep -q 'needs_regenerate=true' && echo "true" || echo "false")
          SKIPPED=$(printf '%s\n' "$SUMMARY_LINE" | grep -q 'skipped=true' && echo "true" || echo "false")

          echo "form_fixes=$FIXES" >> "$GITHUB_OUTPUT"
          echo "form_unfixable=$UNFIXABLE" >> "$GITHUB_OUTPUT"
          echo "form_validation_errors=$ERRORS" >> "$GITHUB_OUTPUT"
          echo "needs_regenerate=$NEEDS_REGENERATE" >> "$GITHUB_OUTPUT"
          echo "form_skipped=$SKIPPED" >> "$GITHUB_OUTPUT"

          if [ "$UNFIXABLE" != "0" ] || [ "$ERRORS" != "0" ] || [ "$VERIFY_EXIT" -ne 0 ]; then
            echo "❌ 自動修正できないフォーム番号の不整合または検証エラーがあるため中断します（PRは作成しません）。"
            echo "   ローカルで 'pnpm run verify:forms' を実行して詳細を確認してください。"
            exit 1
          fi

          # PRセクションを動的構築（スキップ時は空）
          if [ "$SKIPPED" = "true" ]; then
            echo 'form_pr_section=' >> "$GITHUB_OUTPUT"
          else
            echo 'form_pr_section<<FORMSECTION' >> "$GITHUB_OUTPUT"
            echo '### フォーム番号突合' >> "$GITHUB_OUTPUT"
            if [ "$FIXES" != "0" ]; then
              echo "🔧 **${FIXES} 件のフォームマッピングを自動修正しました。**" >> "$GITHUB_OUTPUT"
            else
              echo '✅ フォーム番号突合OK（修正なし）' >> "$GITHUB_OUTPUT"
            fi
            DIFF_LINES=$(printf '%s\n' "$VERIFY_OUTPUT" | grep -E '^\s*\[(AUTO-FIX|UNFIXABLE|ERROR|ALIAS BAD)\]' | head -30 || true)
            if [ -n "$DIFF_LINES" ]; then
              echo '```' >> "$GITHUB_OUTPUT"
              echo "$DIFF_LINES" >> "$GITHUB_OUTPUT"
              echo '```' >> "$GITHUB_OUTPUT"
            fi
            echo 'FORMSECTION' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for master data changes
        if: steps.wiki_fetch.outputs.fetched == 'true'
        id: master_check
        run: |
          echo "=== マスターデータ差分確認（同一Wikiスナップショット使用）==="
          EXIT_CODE=0
          OUTPUT=$(node scripts/generate-pokemon-master.mjs \
            --non-interactive \
            --dry-run \
            --db /tmp/pokemon-db.json 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "❌ マスター事前検査が失敗しました（exit=$EXIT_CODE）。未知フォームまたは未知食材を確認してください。"
            exit 1
          fi

          SUMMARY_LINE=$(printf '%s\n' "$OUTPUT" | grep '^\[SUMMARY\]' | tail -n 1 || true)
          DB_CHANGED="false"
          if ! diff -q --strip-trailing-cr /tmp/pokemon-db.json src/domain/pokesleep/_generated/pokemon-db.json >/dev/null 2>&1 \
            || ! diff -q --strip-trailing-cr /tmp/pokemon-db.ts src/domain/pokesleep/pokemon-db.ts >/dev/null 2>&1; then
            DB_CHANGED="true"
          fi

          if printf '%s\n' "$SUMMARY_LINE" | grep -q 'has_changes=true' || [ "$DB_CHANGED" = "true" ]; then
            echo "has_master_changes=true" >> "$GITHUB_OUTPUT"
            echo "マスターデータ変更あり"
          else
            echo "has_master_changes=false" >> "$GITHUB_OUTPUT"
            echo "マスターデータ変更なし"
          fi

          # サマリーを保存（追加/削除・内容変更・食材C未実装の差分情報を抽出）
          echo 'master_summary<<EOF' >> "$GITHUB_OUTPUT"
          { printf '%s\n' "$OUTPUT" | grep -E '^(\[追加される|\[削除される|\[内容変更される|\[食材C未実装|  [+-] (#|idForm=)|  ~ |- #)' || true; } | head -50 >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Update master data and verify generated index
        if: steps.wiki_fetch.outputs.fetched == 'true' && (steps.master_check.outputs.has_master_changes == 'true' || steps.form_verify.outputs.form_fixes != '0' || steps.form_verify.outputs.needs_regenerate == 'true')
        run: |
          echo "=== マスターデータ更新（同一Wikiスナップショットから生成）==="
          node scripts/generate-pokemon-master.mjs \
            --non-interactive \
            --db /tmp/pokemon-db.json

          if ! diff -q --strip-trailing-cr /tmp/pokemon-db.ts src/domain/pokesleep/pokemon-db.ts >/dev/null 2>&1; then
            cp /tmp/pokemon-db.ts src/domain/pokesleep/pokemon-db.ts
          fi
          if ! diff -q --strip-trailing-cr /tmp/pokemon-db.json src/domain/pokesleep/_generated/pokemon-db.json >/dev/null 2>&1; then
            cp /tmp/pokemon-db.json src/domain/pokesleep/_generated/pokemon-db.json
          fi

          echo "=== 生成済み索引の最終検証 ==="
          node scripts/verify-form-mapping.mjs \
            --pokesleep-tool /tmp/pokesleep-tool \
            --db src/domain/pokesleep/_generated/pokemon-db.json \
            --verify-generated

      - name: Update candy families
        if: steps.wiki_fetch.outputs.fetched == 'true' || github.event.inputs.refresh_candy_families == 'true'
        id: candy_families
        run: |
          echo "=== 種族アメ系統の検証・更新 ==="
          FAMILY_ARGS=()
          if [ "${{ github.event.inputs.refresh_candy_families }}" = "true" ]; then
            FAMILY_ARGS+=(--refresh)
          fi
          if [ -d /tmp/pokesleep-tool ]; then
            FAMILY_ARGS+=(--pokesleep-tool /tmp/pokesleep-tool)
          fi
          FAMILY_EXIT=0
          FAMILY_OUTPUT=$(pnpm run generate:candy-families -- "${FAMILY_ARGS[@]}" 2>&1) || FAMILY_EXIT=$?
          echo "$FAMILY_OUTPUT"
          if [ "$FAMILY_EXIT" -ne 0 ]; then
            echo "❌ 種族アメ系統の生成に失敗しました（exit=$FAMILY_EXIT）"
            exit 1
          fi
          if printf '%s\n' "$FAMILY_OUTPUT" | grep -q '\[SUMMARY\] has_changes=true' \
            || ! git diff --quiet -- src/domain/pokesleep/_generated/candy-family.ts; then
            echo "has_family_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_family_changes=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'family_summary<<FAMILYEOF'
            printf '%s\n' "$FAMILY_OUTPUT" | grep -E '^(\[SUMMARY\]|\[(FAMILY|ANCESTOR) (ADDED|CHANGED|REMOVED)\]|\[generate-candy-families\])' || true
            if ! git diff --quiet -- src/domain/pokesleep/_generated/candy-family.ts; then
              echo '[WORKTREE DIFF] family map was updated'
              git diff --unified=0 -- src/domain/pokesleep/_generated/candy-family.ts \
                | grep -E '^[+-]  "[0-9]+"' \
                | head -50 \
                || true
            fi
            echo 'FAMILYEOF'
          } >> "$GITHUB_OUTPUT"
          pnpm run verify:candy-families

      - name: Update English names and check changes
        id: en_names
        run: |
          echo "=== 英語名取得（PokeAPI）==="

          # 月1日のスケジュール or 手動で --refresh 指定時は全件再取得
          DAY_OF_MONTH=$(date -u +%d)
          REFRESH_REQUESTED="${{ github.event.inputs.refresh_en_names }}"

          EN_EXIT_CODE=0
          if [ "$DAY_OF_MONTH" = "01" ] || [ "$REFRESH_REQUESTED" = "true" ]; then
            echo "全件再取得モード（--refresh）"
            EN_OUTPUT=$(pnpm run generate:pokemon-en-names -- --refresh 2>&1) || EN_EXIT_CODE=$?
          else
            echo "通常モード（キャッシュ利用）"
            EN_OUTPUT=$(pnpm run generate:pokemon-en-names 2>&1) || EN_EXIT_CODE=$?
          fi
          echo "$EN_OUTPUT"

          # 英語名取得が失敗した場合は中断
          if [ "$EN_EXIT_CODE" -ne 0 ]; then
            echo "❌ 英語名取得に失敗しました"
            echo "en_success=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "en_success=true" >> "$GITHUB_OUTPUT"

          # 変更があるかチェック（[SUMMARY]行をパース）
          if printf '%s\n' "$EN_OUTPUT" | grep -q '\[SUMMARY\] has_changes=true'; then
            echo "has_en_changes=true" >> "$GITHUB_OUTPUT"
            echo "英語名変更あり"
          else
            echo "has_en_changes=false" >> "$GITHUB_OUTPUT"
            echo "英語名変更なし"
          fi

          # サマリーを保存（追加/変更/削除の行 + 個別ポケモン名）
          echo 'en_summary<<EOF' >> "$GITHUB_OUTPUT"
          { printf '%s\n' "$EN_OUTPUT" | grep -E '^(✅|📝|🗑️|変更なし|   #)' || true; } | head -50 >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - name: Check if any changes exist
        id: final_check
        run: |
          MASTER_CHANGES="${{ steps.master_check.outputs.has_master_changes || 'false' }}"
          EN_CHANGES="${{ steps.en_names.outputs.has_en_changes || 'false' }}"
          FORM_FIXES="${{ steps.form_verify.outputs.form_fixes || '0' }}"
          FAMILY_CHANGES="${{ steps.candy_families.outputs.has_family_changes || 'false' }}"
          WORKTREE_CHANGED="false"
          if [ -n "$(git status --porcelain)" ]; then
            WORKTREE_CHANGED="true"
          fi

          echo "Master changes: $MASTER_CHANGES"
          echo "EN names changes: $EN_CHANGES"
          echo "Form fixes: $FORM_FIXES"
          echo "Candy family changes: $FAMILY_CHANGES"
          echo "Worktree changed: $WORKTREE_CHANGED"

          if [ "$MASTER_CHANGES" = "true" ] || [ "$EN_CHANGES" = "true" ] || [ "$FORM_FIXES" != "0" ] || [ "$FAMILY_CHANGES" = "true" ] || [ "$WORKTREE_CHANGED" = "true" ]; then
            echo "has_any_changes=true" >> "$GITHUB_OUTPUT"
            echo "変更あり → 検証・PR作成へ進む"
          else
            echo "has_any_changes=false" >> "$GITHUB_OUTPUT"
            echo "変更なし → PR作成スキップ"
          fi

      # テスト設定（test-config.json の latestPokemon.name）は
      # generate-pokemon-master.mjs 内で追加ポケモン検出時に自動更新される

      - name: Build
        if: steps.final_check.outputs.has_any_changes == 'true'
        run: pnpm run build

      - name: Check ingredient label maps
        if: steps.final_check.outputs.has_any_changes == 'true'
        id: ingredient_labels
        run: |
          ING_EXIT=0
          OUTPUT=$(node scripts/check-ingredient-labels.mjs --fail-on-gap 2>&1) || ING_EXIT=$?
          echo "$OUTPUT"
          if [ "$ING_EXIT" -ne 0 ]; then
            echo "❌ 食材キーと表示マップ（またはWiki生データ）に不整合があるため中断します（PRは作成しません）。"
            exit 1
          fi
          {
            echo 'ingredient_summary<<INGEOF'
            echo "$OUTPUT"
            echo 'INGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.final_check.outputs.has_any_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_PAT }}
          commit-message: "feat: ポケモンマスターデータ自動更新"
          title: "🎄 ポケモンマスターデータ自動更新"
          body: |
            ## 自動更新: ポケモンマスターデータ

            このPRはGitHub Actionsにより自動生成されました。

            ### 変更内容（マスターデータ）
            ```
            ${{ steps.master_check.outputs.master_summary }}
            ```

            ### 変更内容（英語名）
            ```
            ${{ steps.en_names.outputs.en_summary }}
            ```

            ${{ steps.form_verify.outputs.form_pr_section }}

            ### 種族アメ系統
            ```
            ${{ steps.candy_families.outputs.family_summary }}
            ```

            ### 食材ラベル（マスターとボックスUIの突合）
            ```
            ${{ steps.ingredient_labels.outputs.ingredient_summary }}
            ```

            ### ⚠️ 確認事項
            - 上記「食材ラベル」に「要対応」がある場合は `scripts/pokemon-ingredient-resolution.mjs` と `src/composables/useBoxStore.ts` の `ingredientJa` / `ingredientEn` を確認してください（`pnpm run check:ingredient-labels -- --fail-on-gap` でローカル確認可）
            - 600族・準伝・幻 (900/1080/1320) は手動で修正してください
            - リージョンフォーム名がある場合は英訳を確認してください

            ### 手動修正が必要な場合
            1. このPRをクローズ（マージせずに閉じる）
            2. ローカルで `pnpm run update:all` を実行（対話モードで expType を設定）

            ---
            *Generated by [Auto Update Pokemon Data](.github/workflows/auto-update-pokemon.yml)*
          branch: auto-update/pokemon-data
          delete-branch: true
          labels: |
            automated
            data-update
